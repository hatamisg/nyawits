idth="420" height="140" rx="22" fill="#f1eaff" stroke="#d4dfd9"/><text x="84" y="418" class="h">APP &amp; SHARED</text><text x="84" y="456" class="p">Composition · DesignSystem</text><text x="84" y="489" class="s">Merakit dependency + UI bersama</text><g fill="none" stroke="#527467" stroke-width="2.5" marker-end="url(#arrow)"><path d="M480 230 H548"/><path d="M770 300 V368"/><path d="M770 520 V588"/><path d="M480 670 H548"/><path d="M270 520 V588"/></g><text x="785" y="348" class="s">aksi</text><text x="785" y="562" class="s">kontrak</text><text x="290" y="562" class="s">memilih adapter</text><text x="60" y="795" class="p">Panah = menggunakan / bergantung pada.</text><text x="60" y="827" class="s">Data mengimplementasikan kontrak Domain. UI tidak menulis JSON.</text><rect x="60" y="861" width="920" height="82" rx="20" fill="#193e31"/><text x="84" y="893" style="fill:white;font-size:18px;font-family:Arial">A: Home   •   B: Area + Mulsa   •   C: Kamera + Data</text><text x="84" y="921" style="fill:#d9eee2;font-size:16px;font-family:Arial">Domain / Application / Shared: sepakati perubahan bersama.</text></svg>
